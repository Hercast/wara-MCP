[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "altium-lite-mcp"
version = "0.1.0"
description = "Experimental MCP server that lets an LLM read and make small edits to an open Altium Designer project (Windows)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2,<2",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
altium-lite-mcp = "altium_lite_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/altium_lite_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
